<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Менеджер расписания</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="/js/api.js" defer></script>
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <div class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <header class="auth-head">
        <span class="auth-logo" aria-hidden="true">Р</span>
        <h1>Вход в админку</h1>
        <p class="sub">Менеджер расписания · панель администратора</p>
      </header>

      <div class="field">
        <label for="username">Логин</label>
        <div class="input-wrap">
          <input id="username" name="username" type="text" autocomplete="username" value="admin" required>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <div class="input-wrap has-toggle">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль" autofocus required>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Показать пароль" title="Показать пароль">
            <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
          </button>
        </div>
      </div>

      <button class="btn full auth-submit" type="submit" id="loginBtn">
        <span class="btn-label">Войти</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
      <p class="foot-note"><a href="/weekly.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> К расписанию</a></p>
    </form>
  </div>

  <script src="/js/login.js" defer></script>
  <script src="/js/bg-gradient.js"></script>
</body>
</html>
